<script>/* Portfolio startup diagnostics; no network or saved data. */

(() => {
  'use strict';
  const fields=['name','location','email','phone','github','headline','summary','about','purpose','interests'];
  const groups={experience:['organization','role','dates','location','details'],education:['organization','title','dates','details'],capabilities:['title','details'],projects:['title','category','status','details','url']};
  const url=value=>{if(!value)return '';const u=new URL(value);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error('Use an HTTP or HTTPS link without credentials.');return u.href;};

    if(!out.name||!out.email||!/^\S+@\S+\.\S+$/.test(out.email)||/[\r\n]/.test(out.email))throw Error('Enter a name and valid email address.');
    out.github=url(out.github);
    for(const [key,columns] of Object.entries(groups)){
      if(!Array.isArray(value[key])||value[key].length>50)throw Error('Use up to 50 entries in '+key+'.');
      out[key]=value[key].map(row=>{if(!row||typeof row!=='object')throw Error('Invalid '+key+' entry.');const result={};for(const column of columns){if(typeof row[column]!=='string'||row[column].length>6000)throw Error('Invalid '+column+'.');result[column]=row[column].trim();}if('url' in result)result.url=url(result.url);return result;});

  const paragraph=(host,text,cls)=>{if(text)host.append(node('p',text,cls));};
  function link(host,text,href){if(!href)return;const a=node('a',text,'inline-link');a.href=href;if(href.startsWith('http')){a.target='_blank';a.rel='noopener noreferrer';}host.append(a);}

      const body=face.querySelector('.face-content');
      const area=node('div',undefined,'reading-area');area.tabIndex=-1;area.append(node('h2',titles[index]));body.replaceChildren(area);
      if(index===0){paragraph(area,p.summary,'lead');paragraph(area,p.about);const section=node('section',undefined,'education');section.append(node('h3','What I want to build'));paragraph(section,p.purpose);paragraph(section,p.interests);area.append(section);}
      if(index===1){const timeline=node('div',undefined,'timeline');for(const job of p.experience){const s=node('section');s.append(node('div',job.dates+' · '+job.location,'job-meta'),node('h3',job.organization),node('p',job.role,'role'));for(const text of job.details.split('\n'))paragraph(s,text);timeline.append(s);}area.append(timeline);}

<script>/* Device-local time only. No location lookup, weather service or network. */
(() => {
  'use strict';
  if(!document.querySelector('#app'))return;
  const app=document.querySelector('#app'),select=document.querySelector('#sky-mode');
  const palettes={
    dawn:{dark:false,top:'#b8d2e4',mid:'#e7e5df',horizon:'#f1cdaa',water:'#afc3cc',cloud:.54},
    day:{dark:false,top:'#83b4d2',mid:'#c7e0ec',horizon:'#edf0e9',water:'#b9cbd2',cloud:.64},
    dusk:{dark:true,top:'#1c2c48',mid:'#665a78',horizon:'#ce9b9a',water:'#7d8eaa',cloud:.36},
    night:{dark:true,top:'#091628',mid:'#172c47',horizon:'#46536c',water:'#536f8b',cloud:.18}
  };
  const rgb=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);
  function phase(hour){return hour<5?'night':hour<8?'dawn':hour<17?'day':hour<20?'dusk':'night';}
  let state={},stamp='';
  function refresh(){
    const now=new Date(),hour=now.getHours()+now.getMinutes()/60,automatic=select.value==='auto',key=automatic?phase(hour):select.value;
    const p=palettes[key],next=key+':'+now.getHours()+':'+now.getMinutes();
    if(next===stamp)return;stamp=next;
    app.dataset.sky=key;app.dataset.theme=p.dark?'dusk':'dawn';
    for(const [name,value] of Object.entries(p))if(typeof value==='string')app.style.setProperty('--sky-'+name,value);
    app.style.setProperty('--cloud-opacity',String(p.cloud));
    app.style.setProperty('--sun-x',String(automatic?Math.max(12,Math.min(85,15+(hour-5)/15*70)):25)+'%');
    const text=(automatic?'Local time · ':'')+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    document.querySelector('#local-time').textContent=text;
    state={key,dark:p.dark,top:rgb(p.top),horizon:rgb(p.horizon),water:rgb(p.water),cloud:p.cloud};
    document.dispatchEvent(new CustomEvent('portfolio:sky'));
  }
  // One cloud mask shared by the moving sky layers and water reflections.
  const mask=document.createElement('canvas');mask.width=1024;mask.height=256;
  const context=mask.getContext('2d');let seed=7919;
  const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  for(let group=0;group<6;group++){
    const cx=group*180+random()*45,cy=80+random()*85;
    for(let i=0;i<36;i++){
      const x=cx+(random()-.5)*210,y=cy+(random()-.5)*38,r=22+random()*47;
      context.save();context.translate(x,y);context.scale(1,.45+random()*.38);
      const g=context.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'rgba(255,255,255,.10)');g.addColorStop(.5,'rgba(255,255,255,.055)');g.addColorStop(1,'rgba(255,255,255,0)');context.fillStyle=g;context.fillRect(-r,-r,r*2,r*2);context.restore();
    }
  }
  const image=mask.toDataURL('image/png');
  const clouds=document.querySelector('.clouds');
  for(let i=0;i<3;i++){const layer=document.createElement('div');layer.className='cloud-layer cloud-layer-'+i;layer.style.backgroundImage=`url("${image}")`;clouds.append(layer);}
  select.addEventListener('change',()=>{stamp='';refresh();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){stamp='';refresh();}});
  setInterval(()=>{if(!document.hidden)refresh();},60000);
  refresh();
  window.PortfolioEnvironment={get:()=>state,cloudMask:mask,phase};
})();
</script>
<script>/* Local silver portal. No network, providers, or external assets. */
'use strict';
((factory)=>{
  const api=factory();
  if(typeof module==='object'&&module.exports)module.exports=api;
  if(typeof window!=='undefined')window.PortfolioPortal=api;
})(()=>{
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function spring(value,velocity,target,dt,frequency=14){
    const offset=value-target,c=velocity+frequency*offset,e=Math.exp(-frequency*dt);
    return[target+(offset+c*dt)*e,(velocity-frequency*c*dt)*e];
  }
  class Motion{
    constructor(reduced=false){this.form=-1;this.target=-1;this.depth=0;this.velocity=0;this.reduced=reduced;this.phase='idle';this.settleAge=0;}
    request(index){
      if(!Number.isInteger(index)||index< -1||index>5)throw new RangeError('Choose one of the six portfolio sections.');
      this.target=index;
      this.settleAge=this.reduced?2:0;
      if(this.reduced){this.form=index;this.depth=0;this.velocity=0;this.phase=index<0?'idle':'reading';}
      else this.phase=this.form===index?'rising':'submerging';
      return this.snapshot();
    }
    update(dt){
      if(!Number.isFinite(dt)||dt<0)throw new RangeError('Use a nonnegative elapsed time.');
      if(this.reduced)return this.snapshot();
      // A damped spring preserves position and velocity when a selection is
      // changed mid-motion. The form changes only below the liquid surface.
      const goal=this.form===this.target?0:1;
      [this.depth,this.velocity]=spring(this.depth,this.velocity,goal,Math.min(dt,.1),7);
